[package]
name = "bukno-t3-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
keyring = "4.2"
# No TLS in Stage 1: direct pairing uses plain HTTP over the LAN or tailnet, and
# TLS crates compile C that the cross-platform Windows check cannot build.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "macros", "time", "sync", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
url = "2"
uuid.workspace = true


[lints]
workspace = true
