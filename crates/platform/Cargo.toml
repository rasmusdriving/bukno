[package]
name = "bukno-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSWorkspace", "NSAccessibility", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[lints]
workspace = true
