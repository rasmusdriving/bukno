[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/core",
    "crates/runtime",
    "crates/providers",
    "crates/storage",
    "crates/platform",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rasmusdriving/bukno"
publish = false

[workspace.dependencies]
bukno-core = { path = "crates/core" }
bukno-runtime = { path = "crates/runtime" }
bukno-providers = { path = "crates/providers" }
bukno-storage = { path = "crates/storage" }
bukno-platform = { path = "crates/platform" }

eframe = { version = "0.36.2", default-features = false }
egui = "0.36.2"
egui_kittest = "0.36.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Keep UI checks and debug runs responsive: optimise dependencies, keep our own crates fast to build.
[profile.dev.package."*"]
opt-level = 2
