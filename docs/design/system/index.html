<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bukno design system</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/bundle.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/bundle.js"></script>
<style>
  body { margin: 0; background: #1b1a19; }
  .ds { max-width: 1240px; margin: 0 auto; padding: 40px 24px 64px; color: var(--text-primary); font-family: var(--font-sans); }
  .ds > h1 { margin: 0 0 6px; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .ds > p { margin: 0 0 28px; max-width: 700px; font-size: 14px; line-height: 22px; color: var(--text-secondary); }
  .ds a { color: var(--codex); }
  .ds-cover { width: 100%; height: 288px; border: 0; border-radius: 12px; margin-bottom: 36px; background: var(--surface-canvas); }
  .ds-group { margin: 0 0 12px; padding-top: 20px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-tertiary); }
  .ds-card { margin: 0 0 20px; border-radius: 12px; background: var(--surface-canvas); overflow: hidden; }
  .ds-card header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 16px 0; }
  .ds-card h2 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
  .ds-card header a { font-size: 13px; line-height: 18px; }
  .ds-mount { overflow-x: auto; }
</style>
</head>
<body>
<main class="ds">
<h1>Bukno design system</h1>
<p>Live previews of every reference component. Read <a href="README.md">README.md</a> for the rules, and <a href="tokens.json">tokens.json</a> for exact values. The native app reimplements these in Rust; this React code is for previews only.</p>
<iframe class="ds-cover" title="Bukno cover" id="cover"></iframe>
<div id="list"></div>
</main>
<script>
(function () {
  var NAMES = ['Icon', 'ProviderMark', 'StatusGlyph', 'StateChip', 'Button', 'IconButton', 'Kbd', 'Switch', 'Menu',
    'SectionLabel', 'ProjectRow', 'ChatRow', 'UsageMeter', 'ProfileRow', 'Breadcrumb',
    'UserMessage', 'AgentTurn', 'PlanStep', 'ActivityLine', 'CodeBlock', 'Notice', 'TaskBrief', 'EventLine',
    'ThinkingOrb', 'WorkingIndicator', 'TodoList',
    'Composer', 'PermissionControl', 'ModelControl', 'ModelPicker', 'EffortSlider', 'ChangeStrip', 'ApprovalCard',
    'TaskRow', 'EngineCard'];
  var list = document.getElementById('list');

  fetch('components/Cover/preview.html').then(function (r) { return r.text(); }).then(function (html) {
    var head = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"><link rel="stylesheet" href="tokens.css">';
    document.getElementById('cover').srcdoc = html.replace(/^<!--[^>]*-->\s*/, '').replace('<head>', '<head>' + head);
  });

  Promise.all(NAMES.map(function (n) {
    return fetch('components/' + n + '/preview.html').then(function (r) { return r.text(); }).then(function (t) { return { name: n, html: t }; });
  })).then(function (items) {
    var lastGroup = null;
    items.forEach(function (it) {
      var marker = /@dsCard\s+group="([^"]*)"/.exec(it.html);
      var group = marker ? marker[1] : 'Other';
      var rootClass = (/<div id="root" class="([^"]*)"/.exec(it.html) || [])[1] || '';
      var script = (/<script>([\s\S]*?)<\/script>/.exec(it.html) || [])[1] || '';
      if (group !== lastGroup) {
        var g = document.createElement('div'); g.className = 'ds-group'; g.textContent = group; list.appendChild(g); lastGroup = group;
      }
      var card = document.createElement('section'); card.className = 'ds-card';
      card.innerHTML = '<header><h2></h2><a></a></header>';
      card.querySelector('h2').textContent = it.name;
      var link = card.querySelector('a'); link.href = 'components/' + it.name + '/README.md'; link.textContent = 'Guidelines';
      var mount = document.createElement('div'); mount.className = 'ds-mount ' + rootClass;
      card.appendChild(mount); list.appendChild(card);
      try {
        new Function('document', script)({ getElementById: function () { return mount; } });
      } catch (e) {
        mount.textContent = 'Preview failed: ' + e.message;
      }
    });
  });
})();
</script>
</body>
</html>
