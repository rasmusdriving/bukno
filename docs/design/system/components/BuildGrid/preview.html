<!doctype html>
<html>
<head><meta charset="utf-8"><title>BuildGrid preview</title></head>
<body>
<div id="root" class="bk-demo"></div>
<script>
  var B = window.Bukno, h = React.createElement;
  var states = ['thinking', 'reading', 'tool', 'waiting'];
  function labelled(node, text, key) {
    return h('span', { key: key, style: { display: 'inline-flex', flexDirection: 'column', alignItems: 'center', gap: '8px' } }, node, h('span', { className: 'bk-demo__label' }, text));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: '18px' } },
    h('div', { style: { display: 'flex', gap: '36px', alignItems: 'flex-end' } }, states.map(function (s) {
      return labelled(h(B.BuildGrid, { provider: 'codex', state: s, size: 32 }), s, s);
    }).concat([labelled(h(B.BuildGrid, { provider: 'claude', state: 'thinking', size: 32 }), 'claude', 'c')])),
    h('div', { style: { display: 'flex', gap: '36px', alignItems: 'center' } }, states.slice(0, 3).map(function (s) {
      return h(B.BuildGrid, { key: s, provider: 'claude', state: s, size: 20 });
    }).concat([h(B.BuildGrid, { key: 'r', provider: 'codex', state: 'thinking', size: 16 }), h('span', { key: 'l', className: 'bk-demo__label' }, '20px inline, 16px row')]))));
</script>
</body>
</html>
