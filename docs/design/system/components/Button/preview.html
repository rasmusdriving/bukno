<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button preview</title></head>
<body>
<div id="root" class="bk-demo"></div>
<script>
  var B = window.Bukno, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'bk-demo', style: { background: 'var(--surface-composer)', gap: '10px' } },
  h(B.Button, { variant: 'primary', kbd: '\u21B5' }, 'Allow once'),
  h(B.Button, { variant: 'secondary', icon: 'stop' }, 'Stop'),
  h(B.Button, { variant: 'ghost', kbd: 'Esc' }, 'Deny'),
  h(B.Button, { variant: 'secondary', size: 'sm', icon: 'refresh' }, 'Check again'),
  h(B.Button, { variant: 'danger', size: 'sm' }, 'Remove chat'),
  h(B.Button, { variant: 'secondary', disabled: true }, 'Disabled')));
</script>
</body>
</html>
