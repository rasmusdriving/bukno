[package]
name = "bukno-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bukno"
path = "src/main.rs"

[dependencies]
bukno-core.workspace = true
bukno-platform.workspace = true
bukno-runtime.workspace = true
bukno-storage.workspace = true
rfd = "0.17"
eframe = { workspace = true, features = ["wgpu", "accesskit", "default_fonts"] }
egui.workspace = true
png = "0.18"
pulldown-cmark.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
rusqlite.workspace = true
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }

[lints]
workspace = true
